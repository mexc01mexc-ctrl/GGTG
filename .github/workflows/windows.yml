name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'desktop/**'
      - 'windows/**'
      - '.github/workflows/windows.yml'

jobs:
  build:
    name: Build Windows (x64)
    runs-on: windows-latest

    env:
      Platform: x64
      TBUILD: D:\TBuild
      LibrariesPath: D:\TBuild\Libraries\win64
      PreferredToolArchitecture: x64

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Pagefile (16GB - 32GB)
        uses: al-cheb/configure-pagefile-action@v1.5
        with:
          minimum-size: 16GB
          maximum-size: 32GB
          disk-root: "C:"

      - name: Visual Studio ATL component
        shell: pwsh
        run: |
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          $vswhere = Join-Path $installer 'vswhere.exe'
          $setup = Join-Path $installer 'setup.exe'
          if ((Test-Path $vswhere) -and (Test-Path $setup)) {
            $toolsComponent = 'Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64'
            $atlComponent = 'Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL'
            $path = @(& $vswhere -latest -products '*' -requires $toolsComponent -property installationPath)[0]
            if ($path) {
              Write-Host "Installing $atlComponent..."
              $process = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
                'modify',
                '--installPath', "`"$path`"",
                '--add', $atlComponent,
                '--quiet', '--norestart', '--nocache'
              )
            }
          }

      - name: Set up MSVC (Native Tools x64)
        uses: Eden-CI/msvc-dev-cmd@master
        with:
          arch: x64
          sdk: '10.0.26100.0'
          toolset: '14.44'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set up NASM
        uses: ilammy/setup-nasm@v1

      - name: Set up Yasm
        run: choco install yasm -y

      - name: NuGet sources
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages" 2>nul & exit 0
          nuget sources Add -Source https://api.nuget.org/v3/index.json 2>nul & exit 0

      - name: Disable MSYS2 conflicting link.exe & configure environment
        shell: pwsh
        run: |
          # 1. Eliminate MSYS2 POSIX link.exe which shadows MSVC's linker
          $links = @("C:\msys64\usr\bin\link.exe")
          foreach ($link in $links) {
            if (Test-Path $link) {
              Write-Host "Disabling conflicting MSYS2 link.exe at $link..."
              Move-Item -Path $link -Destination "$link.bak" -Force
            }
          }
          # 2. Ensure yasm is in MSYS2 path
          $yasm = (Get-Command yasm.exe -ErrorAction SilentlyContinue).Source
          if (-not $yasm -and (Test-Path "C:\ProgramData\chocolatey\bin\yasm.exe")) {
            $yasm = "C:\ProgramData\chocolatey\bin\yasm.exe"
          }
          if ($yasm -and (Test-Path "C:\msys64\usr\bin")) {
            Write-Host "Copying yasm to C:\msys64\usr\bin\yasm.exe..."
            Copy-Item -Path $yasm -Destination "C:\msys64\usr\bin\yasm.exe" -Force
          }
          # 3. Ensure MSBuild wrapper is in MSYS2 path
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path $vswhere) {
            $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
            if ($msbuild -and (Test-Path "C:\msys64\usr\bin")) {
              $bashPath = $msbuild.Replace('\', '/').Replace('C:', '/c')
              Write-Host "Setting up MSYS2 msbuild wrapper pointing to $bashPath..."
              Set-Content -Path "C:\msys64\usr\bin\msbuild" -Value "#!/bin/sh`nexec `"$bashPath`" `"`$@`"" -NoNewline
              Set-Content -Path "C:\msys64\usr\bin\msbuild.exe" -Value "#!/bin/sh`nexec `"$bashPath`" `"`$@`"" -NoNewline
            }
          }
          # 4. Prevent MSYS2 from mangling compiler flags (/FS, /bigobj, /m:2, etc.)
          Add-Content -Path $env:GITHUB_ENV -Value "MSYS2_ARG_CONV_EXCL=*"
          Add-Content -Path $env:GITHUB_ENV -Value "CHERE_INVOKING=enabled_from_arguments"
          Add-Content -Path $env:GITHUB_ENV -Value "MSYS2_PATH_TYPE=inherit"

      - name: Prepare build tree
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path D:\TBuild\Libraries\win64 | Out-Null
          New-Item -ItemType Directory -Force -Path D:\TBuild\ThirdParty | Out-Null
          robocopy desktop\nicegram-desktop D:\TBuild\tdesktop /E /IS /IT /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -le 7) { exit 0 } else { exit $LASTEXITCODE }

      - name: Restore ThirdParty Cache
        id: restore-thirdparty
        uses: actions/cache/restore@v4
        with:
          path: D:\TBuild\ThirdParty
          key: ${{ runner.os }}-x64-thirdparty-v6-${{ hashFiles('desktop/nicegram-desktop/Telegram/build/prepare/prepare.py') }}
          restore-keys: |
            ${{ runner.os }}-x64-thirdparty-v6-
            ${{ runner.os }}-x64-thirdparty-v5
            ${{ runner.os }}-x64-thirdparty-

      - name: Restore Libraries Cache
        id: restore-libraries
        uses: actions/cache/restore@v4
        with:
          path: D:\TBuild\Libraries\win64
          key: ${{ runner.os }}-x64-libraries-v6-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-x64-libraries-v6-
            ${{ runner.os }}-x64-libraries-v5
            ${{ runner.os }}-x64-libraries-

      - name: Clean incomplete dependency builds
        shell: pwsh
        run: |
          $libsDir = "D:\TBuild\Libraries\win64"
          $tpDir = "D:\TBuild\ThirdParty"
          # Disable MSYS2 link.exe if restored from cache
          if (Test-Path "$tpDir\msys64\usr\bin\link.exe") {
            Move-Item -Path "$tpDir\msys64\usr\bin\link.exe" -Destination "$tpDir\msys64\usr\bin\link.exe.bak" -Force
          }
          # Ensure yasm and msbuild exist in cached MSYS2 as well
          $yasm = (Get-Command yasm.exe -ErrorAction SilentlyContinue).Source
          if (-not $yasm -and (Test-Path "C:\ProgramData\chocolatey\bin\yasm.exe")) {
            $yasm = "C:\ProgramData\chocolatey\bin\yasm.exe"
          }
          if ($yasm -and (Test-Path "$tpDir\msys64\usr\bin")) {
            Copy-Item -Path $yasm -Destination "$tpDir\msys64\usr\bin\yasm.exe" -Force
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path $vswhere) {
            $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
            if ($msbuild -and (Test-Path "$tpDir\msys64\usr\bin")) {
              $bashPath = $msbuild.Replace('\', '/').Replace('C:', '/c')
              Set-Content -Path "$tpDir\msys64\usr\bin\msbuild" -Value "#!/bin/sh`nexec `"$bashPath`" `"`$@`"" -NoNewline
              Set-Content -Path "$tpDir\msys64\usr\bin\msbuild.exe" -Value "#!/bin/sh`nexec `"$bashPath`" `"`$@`"" -NoNewline
            }
          }
          # Ensure git clone doesn't fail on half-baked directories
          $incomplete = @(
            @{ Dir = "$libsDir\libvpx"; Check = "$libsDir\local\lib\x64\vpxmt.lib" },
            @{ Dir = "$libsDir\ffmpeg"; Check = "$libsDir\ffmpeg\libavcodec\avcodec.lib" },
            @{ Dir = "$libsDir\openal-soft"; Check = "$libsDir\openal-soft\build\RelWithDebInfo\OpenAL32.lib" }
          )
          foreach ($item in $incomplete) {
            if ((Test-Path $item.Dir) -and (-not (Test-Path $item.Check))) {
              Write-Host "Cleaning incomplete directory $($item.Dir)..."
              Get-ChildItem -Path $item.Dir -Recurse -Force -ErrorAction SilentlyContinue | ForEach-Object {
                $_.Attributes = 'Normal'
              }
              Remove-Item -Path $item.Dir -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Prepare dependencies
        id: prepare-deps
        working-directory: D:\TBuild\tdesktop\Telegram
        run: |
          set Platform=x64
          set TARGET=
          set _CL_=
          set MSYS2_ARG_CONV_EXCL=*
          call build\prepare\win.bat silent

      - name: Save ThirdParty Cache
        if: always() && steps.restore-thirdparty.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: D:\TBuild\ThirdParty
          key: ${{ runner.os }}-x64-thirdparty-v6-${{ hashFiles('desktop/nicegram-desktop/Telegram/build/prepare/prepare.py') }}

      - name: Save Libraries Cache (Incremental)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: D:\TBuild\Libraries\win64
          key: ${{ runner.os }}-x64-libraries-v6-${{ github.run_id }}

      - name: Configure CMake
        working-directory: D:\TBuild\tdesktop\Telegram
        run: |
          call configure.bat x64 -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      - name: Build GGTG EXE
        working-directory: D:\TBuild\tdesktop\out
        run: |
          set "PreferredToolArchitecture=x64"
          set "_CL_=/FS /bigobj"
          cmake --build . --config Release --target Telegram -- /m:2 /p:CL_MPcount=2 /p:PreferredToolArchitecture=x64 /p:TrackFileAccess=false /v:m /fl /flp:logfile=build.log;verbosity=normal

      - name: Show compilation errors if failed
        if: failure()
        shell: pwsh
        run: |
          Write-Host "=== BUILD ERRORS ===" -ForegroundColor Red
          Get-ChildItem -Path D:\TBuild -Filter "command.bat" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "=== FAILED COMMAND.BAT ($($_.FullName)) ===" -ForegroundColor Magenta
            Get-Content $_.FullName -Tail 50
          }
          if (Test-Path D:\TBuild\Libraries\win64\libvpx\config.log) {
            Write-Host "=== LIBVPX CONFIG.LOG (TAIL) ===" -ForegroundColor Yellow
            Get-Content D:\TBuild\Libraries\win64\libvpx\config.log -Tail 80
          }
          if (Test-Path D:\TBuild\Libraries\win64\ffmpeg\ffbuild\config.log) {
            Write-Host "=== FFMPEG CONFIG.LOG (TAIL) ===" -ForegroundColor Yellow
            Get-Content D:\TBuild\Libraries\win64\ffmpeg\ffbuild\config.log -Tail 80
          }
          if (Test-Path D:\TBuild\tdesktop\out\build.log) {
            Write-Host "=== CMAKE / MSBUILD ERRORS ===" -ForegroundColor Red
            Get-Content D:\TBuild\tdesktop\out\build.log | Select-String -Pattern "error LNK", "error C", ": error:", "FAILED:" -Context 1,1 | Select-Object -First 50
          }

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-failure-log
          path: |
            D:\TBuild\tdesktop\out\build.log
            D:\TBuild\Libraries\win64\*\config.log
            D:\TBuild\**\command.bat
          retention-days: 7

      - name: Locate and Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GGTG-Windows-x64
          path: |
            D:\TBuild\tdesktop\out\Release\*.exe
            D:\TBuild\tdesktop\out\Release\GGTG.exe
            D:\TBuild\tdesktop\out\Release\Telegram.exe
          retention-days: 14

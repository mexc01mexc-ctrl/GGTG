name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'desktop/**'
      - 'windows/**'
      - '.github/workflows/windows.yml'

jobs:
  build:
    name: Build Windows (x64)
    runs-on: windows-latest

    env:
      Platform: x64

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Cache ThirdParty and Libraries
        uses: actions/cache@v4
        with:
          path: |
            D:\TBuild\ThirdParty
            D:\TBuild\Libraries
          key: ${{ runner.os }}-x64-tdesktop-libs-v2
          restore-keys: |
            ${{ runner.os }}-x64-tdesktop-libs-

      - name: Prepare build tree
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path D:\TBuild\Libraries | Out-Null
          New-Item -ItemType Directory -Force -Path D:\TBuild\ThirdParty | Out-Null
          robocopy desktop\nicegram-desktop D:\TBuild\tdesktop /E /IS /IT /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -le 7) { exit 0 } else { exit $LASTEXITCODE }

      - name: Prepare dependencies
        working-directory: D:\TBuild\tdesktop\Telegram
        run: |
          call build\prepare\win.bat skip-release silent || exit 0

      - name: Configure CMake
        working-directory: D:\TBuild\tdesktop\Telegram
        run: |
          call configure.bat x64 -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      - name: Build GGTG EXE
        working-directory: D:\TBuild\tdesktop\out
        run: |
          cmake --build . --config Release --target Telegram -- /v:m /fl /flp:logfile=build.log;verbosity=normal

      - name: Show compilation errors if failed
        if: failure()
        shell: pwsh
        run: |
          Write-Host "=== C++ COMPILATION ERRORS ===" -ForegroundColor Red
          if (Test-Path D:\TBuild\tdesktop\out\build.log) {
            Get-Content D:\TBuild\tdesktop\out\build.log | Select-String -Pattern "error C", ": error:", "FAILED:" -Context 2,2 | Select-Object -First 40
          }

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-failure-log
          path: D:\TBuild\tdesktop\out\build.log
          retention-days: 7

      - name: Locate and Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GGTG-Windows-x64
          path: |
            D:\TBuild\tdesktop\out\Release\*.exe
            D:\TBuild\tdesktop\out\Release\GGTG.exe
            D:\TBuild\tdesktop\out\Release\Telegram.exe
          retention-days: 14

name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'desktop/**'
      - 'windows/**'
      - '.github/workflows/windows.yml'

jobs:
  build:
    name: Build Windows (x64)
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      Platform: x64
      TBUILD: D:\TBuild
      LibrariesPath: D:\TBuild\Libraries\win64
      PreferredToolArchitecture: x64

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Pagefile (16GB - 32GB)
        uses: al-cheb/configure-pagefile-action@v1.5
        with:
          minimum-size: 16GB
          maximum-size: 32GB
          disk-root: "C:"

      - name: Visual Studio ATL component
        shell: pwsh
        run: |
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          $vswhere = Join-Path $installer 'vswhere.exe'
          $setup = Join-Path $installer 'setup.exe'
          if ((Test-Path $vswhere) -and (Test-Path $setup)) {
            $toolsComponent = 'Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64'
            $atlComponent = 'Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL'
            $path = @(& $vswhere -latest -products '*' -requires $toolsComponent -property installationPath)[0]
            if ($path) {
              Write-Host "Installing $atlComponent..."
              $process = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
                'modify',
                '--installPath', "`"$path`"",
                '--add', $atlComponent,
                '--quiet', '--norestart', '--nocache'
              )
            }
          }

      - name: Set up MSVC (Native Tools x64)
        uses: Eden-CI/msvc-dev-cmd@master
        with:
          arch: x64
          sdk: '10.0.26100.0'
          toolset: '14.44'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set up NASM
        uses: ilammy/setup-nasm@v1

      - name: Set up Yasm
        shell: pwsh
        run: |
          try {
            choco install yasm -y
          } catch {}

          # Locate the real standalone yasm binary (not the chocolatey shim)
          $realYasm = ""
          $chocoLib = "C:\ProgramData\chocolatey\lib\yasm\tools"
          if (Test-Path "$chocoLib\yasm.exe") {
            $realYasm = "$chocoLib\yasm.exe"
          } elseif (Test-Path $chocoLib) {
            $found = Get-ChildItem -Path $chocoLib -Filter "*.exe" -Recurse | Where-Object { $_.Name -match "yasm" } | Select-Object -First 1
            if ($found) { $realYasm = $found.FullName }
          }

          if (-not $realYasm -or -not (Test-Path $realYasm)) {
            Write-Host "Downloading standalone yasm.exe directly..."
            New-Item -ItemType Directory -Force -Path "C:\yasm" | Out-Null
            Invoke-WebRequest -Uri "https://www.tortall.net/projects/yasm/releases/yasm-1.3.0-win64.exe" -OutFile "C:\yasm\yasm.exe"
            $realYasm = "C:\yasm\yasm.exe"
          }

          Write-Host "Found real Yasm binary at: $realYasm"
          New-Item -ItemType Directory -Force -Path "C:\yasm" | Out-Null
          Copy-Item -Path $realYasm -Destination "C:\yasm\yasm.exe" -Force
          Add-Content -Path $env:GITHUB_PATH -Value "C:\yasm"
          $env:PATH = "C:\yasm;$env:PATH"

          # Distribute real yasm.exe to every toolchain location
          $destinations = @(
            "C:\Windows\yasm.exe",
            "C:\Windows\System32\yasm.exe",
            "C:\ProgramData\chocolatey\bin\yasm.exe"
          )
          foreach ($dst in $destinations) {
            try {
              $dir = Split-Path $dst
              if (-not (Test-Path $dir)) { New-Item -ItemType Directory -Force -Path $dir | Out-Null }
              Copy-Item -Path $realYasm -Destination $dst -Force -ErrorAction SilentlyContinue
              Write-Host "Copied real yasm to $dst"
            } catch {}
          }

      - name: NuGet sources
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages" 2>nul & exit 0
          nuget sources Add -Source https://api.nuget.org/v3/index.json 2>nul & exit 0

      - name: Disable MSYS2 conflicting link.exe & configure environment
        shell: pwsh
        run: |
          try {
            # 1. Eliminate MSYS2 POSIX link.exe which shadows MSVC's linker
            $links = @("C:\msys64\usr\bin\link.exe", "C:\msys64\usr\bin\link.exe.bak")
            foreach ($link in $links) {
              if (Test-Path $link) {
                Write-Host "Disabling conflicting MSYS2 link.exe at $link..."
                Remove-Item -Path $link -Force -ErrorAction SilentlyContinue
              }
            }
            # 2. Ensure real yasm is in MSYS2 path
            $yasm = ""
            if (Test-Path "C:\yasm\yasm.exe") {
              $yasm = "C:\yasm\yasm.exe"
            } elseif (Test-Path "C:\ProgramData\chocolatey\lib\yasm\tools\yasm.exe") {
              $yasm = "C:\ProgramData\chocolatey\lib\yasm\tools\yasm.exe"
            } else {
              $yasm = (Get-Command yasm.exe -ErrorAction SilentlyContinue).Source
            }
            if ($yasm -and (Test-Path "C:\msys64\usr\bin")) {
              Write-Host "Copying yasm to C:\msys64\usr\bin\yasm.exe..."
              Copy-Item -Path $yasm -Destination "C:\msys64\usr\bin\yasm.exe" -Force -ErrorAction SilentlyContinue
            }
            # 3. Add real MSBuild directory to PATH and ensure yasm is available
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            if (Test-Path $vswhere) {
              $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
              if ($msbuild) {
                $msbuildDir = Split-Path $msbuild
                Write-Host "Found MSBuild at $msbuild"
                Add-Content -Path $env:GITHUB_PATH -Value $msbuildDir
                $env:PATH = "$msbuildDir;$env:PATH"
                if ($yasm) {
                  Copy-Item -Path $yasm -Destination "$msbuildDir\yasm.exe" -Force -ErrorAction SilentlyContinue
                  $msbuildYasmLib = Join-Path (Split-Path $msbuildDir) "lib\yasm\tools"
                  New-Item -ItemType Directory -Force -Path $msbuildYasmLib -ErrorAction SilentlyContinue | Out-Null
                  Copy-Item -Path $yasm -Destination "$msbuildYasmLib\yasm.exe" -Force -ErrorAction SilentlyContinue
                }
              }
            }
            # Purge any fake msbuild scripts in C:\msys64\usr\bin
            Remove-Item -Path "C:\msys64\usr\bin\msbuild.exe" -Force -ErrorAction SilentlyContinue
            Remove-Item -Path "C:\msys64\usr\bin\msbuild" -Force -ErrorAction SilentlyContinue
            # 4. Prevent MSYS2 from mangling compiler flags (/FS, /bigobj, /m:2, etc.)
            Add-Content -Path $env:GITHUB_ENV -Value "MSYS2_ARG_CONV_EXCL=*"
            Add-Content -Path $env:GITHUB_ENV -Value "CHERE_INVOKING=enabled_from_arguments"
            Add-Content -Path $env:GITHUB_ENV -Value "MSYS2_PATH_TYPE=inherit"

            # 5. Disable git autocrlf so cloned bash scripts and makefiles keep LF endings
            git config --global core.autocrlf false

            # 6. Put MSYS2 usr/bin in PATH before System32 so bash/sh invoke MSYS2 rather than WSL stub
            if (Test-Path "C:\msys64\usr\bin") {
              Add-Content -Path $env:GITHUB_PATH -Value "C:\msys64\usr\bin"
              $env:PATH = "C:\msys64\usr\bin;$env:PATH"
            }

            # 7. Ensure MSYS2 has pkgconf installed so /usr/bin/pkg-config is available
            try {
              if (Test-Path "C:\msys64\usr\bin\pacman.exe") {
                Write-Host "Installing MSYS2 pkgconf in C:\msys64..."
                & "C:\msys64\usr\bin\pacman.exe" -S --noconfirm --needed pkgconf make
              }
            } catch {
              Write-Warning "Could not install MSYS2 pkgconf: $_"
            }
          } catch {
            Write-Warning "Configure environment warning: $_"
          }

      - name: Prepare build tree
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path D:\TBuild\Libraries\win64 | Out-Null
          New-Item -ItemType Directory -Force -Path D:\TBuild\ThirdParty | Out-Null
          robocopy desktop\nicegram-desktop D:\TBuild\tdesktop /E /IS /IT /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -le 7) { exit 0 } else { exit $LASTEXITCODE }

      - name: Restore ThirdParty Cache
        id: restore-thirdparty
        uses: actions/cache/restore@v4
        with:
          path: D:\TBuild\ThirdParty
          key: ${{ runner.os }}-x64-thirdparty-v6-${{ hashFiles('desktop/nicegram-desktop/Telegram/build/prepare/prepare.py') }}
          restore-keys: |
            ${{ runner.os }}-x64-thirdparty-v6-
            ${{ runner.os }}-x64-thirdparty-v5
            ${{ runner.os }}-x64-thirdparty-

      - name: Restore Libraries Incremental Cache
        id: restore-libraries
        uses: actions/cache/restore@v4
        with:
          path: D:\TBuild\Libraries\win64
          key: ${{ runner.os }}-x64-libraries-v7-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-x64-libraries-v7-
            ${{ runner.os }}-x64-libraries-v6-

      - name: Clean incomplete dependency builds & verify Qt
        shell: pwsh
        run: |
          try {
            $libsDir = "D:\TBuild\Libraries\win64"
            $tpDir = "D:\TBuild\ThirdParty"

            Write-Host "=== DIRECTORY LISTING OF LIBRARIES ==="
            if (Test-Path $libsDir) {
              Get-ChildItem -Path $libsDir -Depth 1 -ErrorAction SilentlyContinue | Select-Object Mode, Name
            } else {
              Write-Host "$libsDir does not exist yet."
            }

            # Disable MSYS2 link.exe if restored from cache or present
            Remove-Item -Path "$tpDir\msys64\usr\bin\link.exe" -Force -ErrorAction SilentlyContinue
            Remove-Item -Path "$tpDir\msys64\usr\bin\link.exe.bak" -Force -ErrorAction SilentlyContinue
            Remove-Item -Path "C:\msys64\usr\bin\link.exe" -Force -ErrorAction SilentlyContinue
            Remove-Item -Path "C:\msys64\usr\bin\link.exe.bak" -Force -ErrorAction SilentlyContinue

            # Ensure corrupt fake msbuild scripts are deleted
            Remove-Item -Path "$tpDir\msys64\usr\bin\msbuild.exe" -Force -ErrorAction SilentlyContinue
            Remove-Item -Path "$tpDir\msys64\usr\bin\msbuild" -Force -ErrorAction SilentlyContinue
            Remove-Item -Path "C:\msys64\usr\bin\msbuild.exe" -Force -ErrorAction SilentlyContinue
            Remove-Item -Path "C:\msys64\usr\bin\msbuild" -Force -ErrorAction SilentlyContinue

            # Ensure msys64 directory junction exists in ThirdParty if needed
            if (-not (Test-Path "$tpDir\msys64") -and (Test-Path "C:\msys64")) {
              New-Item -ItemType Junction -Path "$tpDir\msys64" -Target "C:\msys64" -Force -ErrorAction SilentlyContinue
            }

            # Ensure real yasm exists in MSYS2 and toolchain paths
            $yasm = ""
            if (Test-Path "C:\yasm\yasm.exe") {
              $yasm = "C:\yasm\yasm.exe"
            } elseif (Test-Path "C:\ProgramData\chocolatey\lib\yasm\tools\yasm.exe") {
              $yasm = "C:\ProgramData\chocolatey\lib\yasm\tools\yasm.exe"
            } else {
              $yasm = (Get-Command yasm.exe -ErrorAction SilentlyContinue).Source
            }
            if ($yasm -and (Test-Path "$tpDir\msys64\usr\bin")) {
              Copy-Item -Path $yasm -Destination "$tpDir\msys64\usr\bin\yasm.exe" -Force -ErrorAction SilentlyContinue
            }
            if ($yasm -and (Test-Path "C:\msys64\usr\bin")) {
              Copy-Item -Path $yasm -Destination "C:\msys64\usr\bin\yasm.exe" -Force -ErrorAction SilentlyContinue
            }
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            if (Test-Path $vswhere) {
              $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
              if ($msbuild) {
                $msbuildDir = Split-Path $msbuild
                Add-Content -Path $env:GITHUB_PATH -Value $msbuildDir
                $env:PATH = "$msbuildDir;$env:PATH"
                if ($yasm) {
                  Copy-Item -Path $yasm -Destination "$msbuildDir\yasm.exe" -Force -ErrorAction SilentlyContinue
                  $msbuildYasmLib = Join-Path (Split-Path $msbuildDir) "lib\yasm\tools"
                  New-Item -ItemType Directory -Force -Path $msbuildYasmLib -ErrorAction SilentlyContinue | Out-Null
                  Copy-Item -Path $yasm -Destination "$msbuildYasmLib\yasm.exe" -Force -ErrorAction SilentlyContinue
                }
              }
            }

            # Verify Qt installation
            Write-Host "=== VERIFYING QT INSTALLATION ==="
            $qtPrefix = "$libsDir\Qt-5.15.19"
            $qtCmake = "$qtPrefix\lib\cmake\Qt5\Qt5Config.cmake"
            if (Test-Path $qtCmake) {
              Write-Host "Valid Qt 5.15.19 installation confirmed at $qtPrefix."
              New-Item -ItemType Directory -Force -Path "$libsDir\cache_keys" -ErrorAction SilentlyContinue | Out-Null
              Set-Content -Path "$libsDir\cache_keys\qt_5.15.19" -Value "cached" -ErrorAction SilentlyContinue
              if (-not (Test-Path "$libsDir\qt_5.15.19")) {
                New-Item -ItemType Directory -Force -Path "$libsDir\qt_5.15.19" -ErrorAction SilentlyContinue | Out-Null
              }
            } else {
              Write-Host "Qt 5.15.19 is not fully installed ($qtCmake missing)."
              Write-Host "Purging any stale Qt cache key, directory, and junctions..."
              if (Test-Path "$libsDir\cache_keys\qt_5.15.19") {
                Remove-Item -Path "$libsDir\cache_keys\qt_5.15.19" -Force -ErrorAction SilentlyContinue
              }
              if (Test-Path "$libsDir\qt_5.15.19") {
                Get-ChildItem -Path "$libsDir\qt_5.15.19" -Recurse -Force -ErrorAction SilentlyContinue | ForEach-Object { $_.Attributes = 'Normal' }
                Remove-Item -Path "$libsDir\qt_5.15.19" -Recurse -Force -ErrorAction SilentlyContinue
              }
              if (Test-Path $qtPrefix) {
                try {
                  $item = Get-Item $qtPrefix -Force -ErrorAction SilentlyContinue
                  if ($item -and ($item.Attributes -match "ReparsePoint")) {
                    [System.IO.Directory]::Delete($qtPrefix)
                  } else {
                    Get-ChildItem -Path $qtPrefix -Recurse -Force -ErrorAction SilentlyContinue | ForEach-Object { $_.Attributes = 'Normal' }
                    Remove-Item -Path $qtPrefix -Recurse -Force -ErrorAction SilentlyContinue
                  }
                } catch {
                  Write-Warning "Failed to delete qtPrefix: $_"
                }
              }
            }

            # Ensure zlib aliases (libzs.lib / libzsd.lib) exist
            if (Test-Path "$libsDir\zlib\Release\zlibstatic.lib") {
              Copy-Item "$libsDir\zlib\Release\zlibstatic.lib" "$libsDir\zlib\Release\libzs.lib" -Force -ErrorAction SilentlyContinue
            }
            if (Test-Path "$libsDir\zlib\Debug\zlibstaticd.lib") {
              Copy-Item "$libsDir\zlib\Debug\zlibstaticd.lib" "$libsDir\zlib\Debug\libzsd.lib" -Force -ErrorAction SilentlyContinue
            }
            if (Test-Path "$libsDir\zlib\Debug\zlibstatic.lib") {
              Copy-Item "$libsDir\zlib\Debug\zlibstatic.lib" "$libsDir\zlib\Debug\libzsd.lib" -Force -ErrorAction SilentlyContinue
            }

            # Ensure MSYS2 pkgconf exists in ThirdParty msys64
            try {
              if (Test-Path "$tpDir\msys64\usr\bin\pacman.exe") {
                & "$tpDir\msys64\usr\bin\pacman.exe" -S --noconfirm --needed pkgconf make
              }
            } catch {}

            # Ensure library aliases in local\lib
            $localLib = "$libsDir\local\lib"
            if (Test-Path $localLib) {
              $libPairs = @(
                @("libdav1d.a", "dav1d.lib"),
                @("dav1d.lib", "libdav1d.lib"),
                @("libopenh264.a", "openh264.lib"),
                @("openh264.lib", "libopenh264.lib"),
                @("opus.lib", "libopus.lib"),
                @("libopus.a", "opus.lib"),
                @("vpxmt.lib", "vpx.lib"),
                @("vpx.lib", "libvpx.lib")
              )
              foreach ($pair in $libPairs) {
                $src = Join-Path $localLib $pair[0]
                $dst = Join-Path $localLib $pair[1]
                if ((Test-Path $src) -and (-not (Test-Path $dst))) {
                  Copy-Item $src $dst -Force -ErrorAction SilentlyContinue
                  Write-Host "Created library alias: $dst from $src"
                }
              }
            }
            $localLibX64 = "$libsDir\local\lib\x64"
            if (Test-Path $localLibX64) {
              if (Test-Path "$localLibX64\vpxmt.lib") {
                if (-not (Test-Path "$localLib\vpxmt.lib")) { Copy-Item "$localLibX64\vpxmt.lib" "$localLib\vpxmt.lib" -Force -ErrorAction SilentlyContinue }
                if (-not (Test-Path "$localLib\vpx.lib")) { Copy-Item "$localLibX64\vpxmt.lib" "$localLib\vpx.lib" -Force -ErrorAction SilentlyContinue }
                if (-not (Test-Path "$localLibX64\vpx.lib")) { Copy-Item "$localLibX64\vpxmt.lib" "$localLibX64\vpx.lib" -Force -ErrorAction SilentlyContinue }
              }
            }

            # Ensure git clone doesn't fail on half-baked directories
            $incomplete = @(
              @{ Dir = "$libsDir\libvpx"; Check = @("$libsDir\local\lib\x64\vpxmt.lib", "$libsDir\local\lib\vpx.lib"); Key = "$libsDir\cache_keys\libvpx" },
              @{ Dir = "$libsDir\ffmpeg"; Check = @("$libsDir\ffmpeg\libavcodec\avcodec.lib", "$libsDir\local\include\libavcodec\avcodec.h"); Key = "$libsDir\cache_keys\ffmpeg" },
              @{ Dir = "$libsDir\openal-soft"; Check = @("$libsDir\openal-soft\build\RelWithDebInfo\OpenAL32.lib", "$libsDir\local\include\AL\al.h"); Key = "$libsDir\cache_keys\openal-soft" }
            )
            foreach ($item in $incomplete) {
              $isComplete = $false
              foreach ($chk in $item.Check) {
                if (Test-Path $chk) { $isComplete = $true; break }
              }
              if ((Test-Path $item.Dir) -and (-not $isComplete)) {
                Write-Host "Cleaning incomplete directory $($item.Dir)..."
                Get-ChildItem -Path $item.Dir -Recurse -Force -ErrorAction SilentlyContinue | ForEach-Object {
                  $_.Attributes = 'Normal'
                }
                Remove-Item -Path $item.Dir -Recurse -Force -ErrorAction SilentlyContinue
                if ($item.Key -and (Test-Path $item.Key)) {
                  Remove-Item -Path $item.Key -Force -ErrorAction SilentlyContinue
                }
              }
            }
          } catch {
            Write-Warning "Cleanup warning: $_"
          }

      - name: Prepare dependencies
        id: prepare-deps
        working-directory: D:\TBuild\tdesktop\Telegram
        shell: pwsh
        env:
          Platform: "x64"
          QT: "5.15.19"
          TARGET: ""
          _CL_: ""
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          & cmd.exe /c "call build\prepare\win.bat silent 2>&1" | Tee-Object -FilePath "D:\TBuild\prepare_deps.log"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Save ThirdParty Cache
        if: always() && steps.restore-thirdparty.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: D:\TBuild\ThirdParty
          key: ${{ runner.os }}-x64-thirdparty-v6-${{ hashFiles('desktop/nicegram-desktop/Telegram/build/prepare/prepare.py') }}

      - name: Save Libraries Cache (Incremental)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: D:\TBuild\Libraries\win64
          key: ${{ runner.os }}-x64-libraries-v7-${{ github.run_id }}

      - name: Configure CMake
        working-directory: D:\TBuild\tdesktop\Telegram
        env:
          QT: "5.15.19"
        run: |
          set QT=5.15.19
          call configure.bat x64 -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 -D CMAKE_DISABLE_PRECOMPILE_HEADERS=ON -D CMAKE_AUTOGEN_SKIP_PRECOMPILE_HEADERS=ON

      - name: Build GGTG EXE
        working-directory: D:\TBuild\tdesktop\out
        run: |
          set "PreferredToolArchitecture=x64"
          set "_CL_=/FS /bigobj"
          cmake --build . --config Release --target Telegram -- /m:2 /p:CL_MPcount=2 /p:PreferredToolArchitecture=x64 /p:TrackFileAccess=false /v:m /fl /flp:logfile=build.log;verbosity=normal

      - name: Package GGTG Executable
        if: always()
        shell: pwsh
        run: |
          $releaseDir = "D:\TBuild\tdesktop\out\Release"
          if (Test-Path "$releaseDir\Telegram.exe") {
            Write-Host "Copying Telegram.exe to GGTG.exe..."
            Copy-Item -Path "$releaseDir\Telegram.exe" -Destination "$releaseDir\GGTG.exe" -Force
          }

      - name: Show compilation errors if failed
        if: failure()
        shell: pwsh
        run: |
          Write-Host "=== COLLECTING FAILURE LOGS ===" -ForegroundColor Red
          $summary = "### Windows Build Failure Diagnostics (Run $env:GITHUB_RUN_ID)`n`n"
          try {
            curl.exe -s -d "GGTG CI Build FAILED (Run $env:GITHUB_RUN_ID)" "https://ntfy.sh/ggtg-ci-build-log-4e4b86e2"
          } catch {}
          if (Test-Path D:\TBuild\prepare_deps.log) {
            $tail = Get-Content D:\TBuild\prepare_deps.log -Tail 150
            $summary += "#### Prepare Dependencies Log (Last 150 lines):`n``````text`n$($tail -join "`n")`n```````n"
            try {
              curl.exe -s -T D:\TBuild\prepare_deps.log "https://ntfy.sh/ggtg-ci-build-log-4e4b86e2"
              $tailRaw = Get-Content D:\TBuild\prepare_deps.log -Tail 150 -Raw
              curl.exe -s -d "$tailRaw" "https://ntfy.sh/ggtg-ci-build-log-4e4b86e2"
              $pasteUrl = curl.exe -s -F "file=@D:\TBuild\prepare_deps.log" https://0x0.st
              if ($pasteUrl) {
                curl.exe -s -d "Full log: $pasteUrl" "https://ntfy.sh/ggtg-ci-build-log-4e4b86e2"
              }
            } catch {}
          } else {
            $summary += "prepare_deps.log not found (failure was before dependency preparation).`n"
          }
          Get-ChildItem -Path D:\TBuild -Filter "command.bat" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            $batTail = Get-Content $_.FullName -Tail 50
            $summary += "#### Failed command.bat ($($_.FullName)):`n``````batch`n$($batTail -join "`n")`n```````n"
          }
          Get-ChildItem -Path D:\TBuild -Filter "*.log" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            if ($_.FullName -ne "D:\TBuild\prepare_deps.log") {
              $logTail = Get-Content $_.FullName -Tail 60
              $summary += "#### Log: $($_.Name):`n``````text`n$($logTail -join "`n")`n```````n"
            }
          }
          if ($env:GITHUB_STEP_SUMMARY) {
            Set-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
          }
          Write-Host $summary

          try {
            cd $env:GITHUB_WORKSPACE
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B ci-logs
            git rm -rf . -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path logs | Out-Null
            if (Test-Path D:\TBuild\prepare_deps.log) {
              Copy-Item D:\TBuild\prepare_deps.log logs\prepare_deps.log -Force -ErrorAction SilentlyContinue
            }
            Get-ChildItem -Path D:\TBuild -Filter "*.log" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item $_.FullName logs\ -Force -ErrorAction SilentlyContinue
            }
            git add logs
            git commit --allow-empty -m "ci: failure logs run $env:GITHUB_RUN_ID"
            git push origin ci-logs --force
          } catch {
            Write-Host "Could not push to ci-logs: $_"
          }

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-failure-log
          path: |
            D:/TBuild/prepare_deps.log
            D:/TBuild/**/*.log
            D:/TBuild/**/command.bat
            D:/TBuild/Libraries/win64/command.bat
          if-no-files-found: warn
          retention-days: 7

      - name: Locate and Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GGTG-Windows-x64
          path: |
            D:\TBuild\tdesktop\out\Release\*.exe
            D:\TBuild\tdesktop\out\Release\GGTG.exe
            D:\TBuild\tdesktop\out\Release\Telegram.exe
          if-no-files-found: warn
          retention-days: 14

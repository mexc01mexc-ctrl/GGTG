name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK Components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" "platforms;android-36" "ndk;27.2.12479018" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/Telegram-GGTG/**/*.gradle*', 'android/Telegram-GGTG/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Standalone APK
        working-directory: android/Telegram-GGTG
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m" \
            -Pandroid.injected.build.abi=arm64-v8a \
            -Pandroid.injected.testOnly=false \
            :TMessagesProj_AppStandalone:assembleAfatStandalone --stacktrace 2>&1 | tee ../../gradle_build.log

      - name: Print gradle log on failure
        if: failure()
        run: |
          tail -n 120 gradle_build.log || true
          curl -s -d "$(tail -n 35 gradle_build.log)" "https://ntfy.sh/ggtg-ci-build-log-4e4b86e2" || true

      - name: Find generated APK
        id: find-apk
        run: |
          APK_PATH=$(find android/Telegram-GGTG/TMessagesProj_AppStandalone/build -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android/Telegram-GGTG -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GGTG-Android
          path: ${{ steps.find-apk.outputs.apk_path }}
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-failure-log
          path: |
            android/Telegram-GGTG/TMessagesProj_AppStandalone/build/reports/
            android/Telegram-GGTG/build/reports/
          if-no-files-found: warn
          retention-days: 7

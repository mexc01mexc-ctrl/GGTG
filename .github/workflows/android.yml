name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Linux swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          (sudo fallocate -l 6G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=6144)
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK Components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" "platforms;android-36" "ndk;27.2.12479018" "cmake;3.22.1"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Setup ccache for NDK C++
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-android-ccache
          max-size: 4G

      - name: Setup Gradle Build Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Build Standalone APK
        working-directory: android/Telegram-GGTG
        run: |
          set -eo pipefail
          chmod +x gradlew
          export NDK_CCACHE="$(which ccache)"
          export CMAKE_C_COMPILER_LAUNCHER="$(which ccache)"
          export CMAKE_CXX_COMPILER_LAUNCHER="$(which ccache)"
          ./gradlew --build-cache --parallel \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g" \
            -Dorg.gradle.caching=true \
            --max-workers=4 \
            -Pandroid.injected.build.abi=arm64-v8a \
            -Pandroid.injected.testOnly=false \
            :TMessagesProj_AppStandalone:assembleAfatStandalone 2>&1 | tee "$GITHUB_WORKSPACE/gradle_build.log"
          echo "=== CCACHE STATISTICS ==="
          ccache -s || true

      - name: Find generated APK
        id: find-apk
        run: |
          APK_PATH=$(find "$GITHUB_WORKSPACE/android/Telegram-GGTG/TMessagesProj_AppStandalone/build" -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find "$GITHUB_WORKSPACE/android/Telegram-GGTG" -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: No APK found after build!"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GGTG-Android
          path: ${{ steps.find-apk.outputs.apk_path }}
          retention-days: 14

      - name: Notify build success
        if: success()
        run: |
          curl -s -d "GGTG Android APK Build SUCCEEDED (Run $GITHUB_RUN_ID)! Artifact GGTG-Android is ready." "https://ntfy.sh/ggtg-ci-build-log-4e4b86e2" || true

      - name: Print and notify gradle log on failure
        if: failure()
        run: |
          echo "=== GRADLE LOG FAILURE DIAGNOSTICS ==="
          grep -B 5 -A 25 -i "FAILURE: Build failed" "$GITHUB_WORKSPACE/gradle_build.log" || tail -n 100 "$GITHUB_WORKSPACE/gradle_build.log" || true
          curl -s -d "GGTG Android APK Build FAILED (Run $GITHUB_RUN_ID)" "https://ntfy.sh/ggtg-ci-build-log-4e4b86e2" || true
          PASTE_URL=$(curl -s --data-binary @"$GITHUB_WORKSPACE/gradle_build.log" https://paste.c-net.org/ || true)
          if [ -n "$PASTE_URL" ]; then
            curl -s -d "Full Gradle Log: $PASTE_URL" "https://ntfy.sh/ggtg-ci-build-log-4e4b86e2" || true
          fi
          grep -B 2 -A 15 -i "FAILURE: Build failed" "$GITHUB_WORKSPACE/gradle_build.log" | curl -s --data-binary @- "https://ntfy.sh/ggtg-ci-build-log-4e4b86e2" || true

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-failure-log
          path: |
            gradle_build.log
            android/Telegram-GGTG/TMessagesProj_AppStandalone/build/reports/
            android/Telegram-GGTG/build/reports/
          if-no-files-found: warn
          retention-days: 7

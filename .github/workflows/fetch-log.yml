name: Fetch Failure Log

on:
  push:
    paths:
      - '.github/workflows/fetch-log.yml'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build-failure-log
          run-id: 40602364773
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: failure_logs

      - name: Inspect and send logs
        run: |
          ls -la failure_logs
          find failure_logs -type f
          LOGFILE=$(find failure_logs -name "prepare_deps.log" | head -n 1)
          if [ -z "$LOGFILE" ]; then
            LOGFILE=$(find failure_logs -type f | head -n 1)
          fi
          echo "Found log: $LOGFILE"
          tail -n 100 "$LOGFILE"
          tail -n 50 "$LOGFILE" | curl -s -d @- "https://ntfy.sh/ggtg-ci-build-log-4e4b86e2"
          curl -s -T "$LOGFILE" -H "Filename: prepare_deps.txt" "https://ntfy.sh/ggtg-ci-build-log-4e4b86e2"

      - name: Push to ci-logs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-logs
          git rm -rf . || true
          mkdir -p logs
          cp -rf failure_logs/* logs/ || true
          git add -f logs
          git commit --allow-empty -m "ci: failure logs run 40602364773"
          git push origin ci-logs --force

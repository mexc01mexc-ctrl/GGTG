name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'desktop/**'
      - '.github/workflows/macos.yml'

jobs:
  build:
    name: Build macOS (ARM64)
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment symlinks and toolchain aliases
        run: |
          # 1. Project path alias
          sudo mkdir -p /Users/macbookair/Desktop
          sudo ln -sfn "$GITHUB_WORKSPACE" /Users/macbookair/Desktop/GGTG

          # 2. SDK alias (bridges runner SDK to MacOSX27.0.sdk required by project)
          SDK_PATH=$(xcrun --sdk macosx --show-sdk-path)
          SDK_DIR=$(dirname "$SDK_PATH")
          echo "Current SDK: $SDK_PATH"
          sudo ln -sfn "$SDK_PATH" "$SDK_DIR/MacOSX27.0.sdk"

          # 3. CMake and Python tool aliases
          sudo mkdir -p /opt/homebrew/bin /opt/homebrew/Frameworks/Python.framework/Versions/3.15/bin
          sudo ln -sfn "$(which cmake)" /opt/homebrew/bin/cmake || true
          sudo ln -sfn "$(which python3)" /opt/homebrew/Frameworks/Python.framework/Versions/3.15/bin/python3.15 || true
          sudo ln -sfn "$(which python3)" /opt/homebrew/bin/python3 || true

      - name: Restore macOS Libraries Cache
        id: cache-libraries
        uses: actions/cache/restore@v4
        with:
          path: |
            desktop/Libraries
            desktop/nicegram-desktop/out
          key: ${{ runner.os }}-arm64-full-v1

      - name: Fetch and unpack dependencies from storage branch
        if: steps.cache-libraries.outputs.cache-hit != 'true'
        run: |
          echo "Restoring macOS dependencies from storage branch..."
          git clone --branch macos-deps-storage --depth 1 https://github.com/mexc01mexc-ctrl/GGTG.git /tmp/deps-repo
          cat /tmp/deps-repo/macos_deps.tar.gz.part_* > /tmp/macos_deps.tar.gz
          tar -xzf /tmp/macos_deps.tar.gz -C .
          rm -rf /tmp/deps-repo /tmp/macos_deps.tar.gz

      - name: Save macOS Libraries Cache
        if: steps.cache-libraries.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            desktop/Libraries
            desktop/nicegram-desktop/out
          key: ${{ runner.os }}-arm64-full-v1

      - name: Build macOS Application
        run: |
          set -eo pipefail
          cd desktop/nicegram-desktop/out
          xcodebuild -project Telegram.xcodeproj -target Telegram -configuration Release ARCHS=arm64 ONLY_ACTIVE_ARCH=YES 2>&1 | tee /tmp/xcode_build.log

      - name: Report build error on failure
        if: failure()
        run: |
          echo "=== XCODEBUILD LOG TAIL ==="
          tail -n 80 /tmp/xcode_build.log || true
          tail -n 35 /tmp/xcode_build.log | curl -s --data-binary @- "https://ntfy.sh/ggtg-ci-build-log-4e4b86e2" || true

      - name: Package DMG
        run: |
          chmod +x desktop/nicegram-desktop/Telegram/build/ggtg/make_dmg.sh
          desktop/nicegram-desktop/Telegram/build/ggtg/make_dmg.sh

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GGTG-macOS-DMG
          path: APP/GGTG.dmg
          retention-days: 14

      - name: Notify build status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            curl -s -d "GGTG macOS DMG Build SUCCEEDED (Run ${{ github.run_id }})! Artifact GGTG-macOS-DMG is ready." "https://ntfy.sh/ggtg-ci-build-log-4e4b86e2" || true
          else
            curl -s -d "GGTG macOS DMG Build FAILED (Run ${{ github.run_id }})" "https://ntfy.sh/ggtg-ci-build-log-4e4b86e2" || true
          fi

name: Build macOS DMG
# Full macOS ARM64 CI: 16 chunks with boost/regex, WebRTC tg_owt, and Qt objects

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'desktop/**'
      - '.github/workflows/macos.yml'

jobs:
  build:
    name: Build macOS (ARM64)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Package macOS DMG
        run: |
          exec > >(tee /tmp/full_macos_ci.log) 2>&1
          set -exo pipefail

          echo "=== 1. Setup symlinks and toolchain aliases ==="
          sudo mkdir -p /Users/macbookair/Desktop
          sudo ln -sfn "$GITHUB_WORKSPACE" /Users/macbookair/Desktop/GGTG

          SDK_PATH=$(xcrun --sdk macosx --show-sdk-path)
          SDK_DIR=$(dirname "$SDK_PATH")
          echo "Current SDK: $SDK_PATH"
          sudo ln -sfn "$SDK_PATH" "$SDK_DIR/MacOSX27.0.sdk"

          sudo mkdir -p /opt/homebrew/Frameworks/Python.framework/Versions/3.15/bin
          sudo rm -f /opt/homebrew/Frameworks/Python.framework/Versions/3.15/bin/python3.15
          printf '#!/bin/bash\nexec /usr/bin/python3 "$@"\n' | sudo tee /opt/homebrew/Frameworks/Python.framework/Versions/3.15/bin/python3.15 > /dev/null
          sudo chmod +x /opt/homebrew/Frameworks/Python.framework/Versions/3.15/bin/python3.15

          echo "=== 2. Checkout complete dependencies (16 chunks) from macos-deps-storage ==="
          git clone --depth 1 --branch macos-deps-storage "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /tmp/deps-repo

          echo "=== 3. Reassemble and unpack dependencies ==="
          cat /tmp/deps-repo/macos_deps.tar.gz.part_* > /tmp/macos_deps.tar.gz
          tar -xzf /tmp/macos_deps.tar.gz -C "$GITHUB_WORKSPACE"
          rm -rf /tmp/deps-repo /tmp/macos_deps.tar.gz
          echo "Dependencies unpacked successfully."

          echo "Creating compatibility symlinks for debug static library references..."
          find "$GITHUB_WORKSPACE/desktop/Libraries" -name "*.a" ! -name "*_debug.a" | while read -r lib; do
            dir=$(dirname "$lib")
            base=$(basename "$lib" .a)
            debug_lib="$dir/${base}_debug.a"
            if [ ! -e "$debug_lib" ]; then
              ln -sf "$(basename "$lib")" "$debug_lib"
            fi
          done

          echo "Bypassing ReRunCMake in CI..."
          printf 'all:\n\t@echo "Skipping CMake regeneration in CI"\n' > "$GITHUB_WORKSPACE/desktop/nicegram-desktop/out/CMakeScripts/ReRunCMake.make"

          echo "Sanitizing Python and tool paths in project files..."
          find "$GITHUB_WORKSPACE/desktop/nicegram-desktop/out" \( -name "*.sh" -o -name "project.pbxproj" \) -type f -exec sed -i '' 's|/opt/homebrew/Frameworks/Python.framework/Versions/3.15/bin/python3.15|/usr/bin/python3|g' {} +
          ls -la "$GITHUB_WORKSPACE/desktop/Libraries"
          ls -la "$GITHUB_WORKSPACE/desktop/nicegram-desktop/out"

          echo "=== 4. Build Telegram.xcodeproj ==="
          cd "$GITHUB_WORKSPACE/desktop/nicegram-desktop/out"
          xcodebuild -project Telegram.xcodeproj -target Telegram -configuration Release ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO

          echo "=== 5. Package DMG ==="
          chmod +x "$GITHUB_WORKSPACE/desktop/nicegram-desktop/Telegram/build/ggtg/make_dmg.sh"
          "$GITHUB_WORKSPACE/desktop/nicegram-desktop/Telegram/build/ggtg/make_dmg.sh"
          ls -lh "$GITHUB_WORKSPACE/APP/GGTG.dmg"

      - name: Report failure diagnostics
        if: failure()
        run: |
          echo "=== FAILURE LOG ==="
          if [ -f /tmp/full_macos_ci.log ]; then
            tail -n 100 /tmp/full_macos_ci.log || true
            PASTE_URL=$(curl -s --data-binary @/tmp/full_macos_ci.log https://paste.c-net.org/ || true)
            if [ -n "$PASTE_URL" ]; then
              curl -s -d "Full macOS CI log: $PASTE_URL" "https://ntfy.sh/ggtg-ci-build-log-4e4b86e2" || true
            fi
            tail -n 30 /tmp/full_macos_ci.log | curl -s --data-binary @- "https://ntfy.sh/ggtg-ci-build-log-4e4b86e2" || true
          fi

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GGTG-macOS-DMG
          path: APP/GGTG.dmg
          retention-days: 14

      - name: Notify build status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            curl -s -d "GGTG macOS DMG Build SUCCEEDED (Run ${{ github.run_id }})! Artifact GGTG-macOS-DMG is ready." "https://ntfy.sh/ggtg-ci-build-log-4e4b86e2" || true
          else
            curl -s -d "GGTG macOS DMG Build FAILED (Run ${{ github.run_id }})" "https://ntfy.sh/ggtg-ci-build-log-4e4b86e2" || true
          fi

name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'desktop/**'
      - '.github/workflows/macos.yml'

jobs:
  build:
    name: Build macOS (ARM64)
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment symlinks and toolchain aliases
        run: |
          # 1. Project path alias
          sudo mkdir -p /Users/macbookair/Desktop
          sudo ln -sfn "$GITHUB_WORKSPACE" /Users/macbookair/Desktop/GGTG

          # 2. SDK alias (bridges runner SDK to MacOSX27.0.sdk required by project)
          SDK_PATH=$(xcrun --sdk macosx --show-sdk-path)
          SDK_DIR=$(dirname "$SDK_PATH")
          echo "Current SDK: $SDK_PATH"
          sudo ln -sfn "$SDK_PATH" "$SDK_DIR/MacOSX27.0.sdk"

          # 3. CMake and Python tool aliases
          sudo mkdir -p /opt/homebrew/bin /opt/homebrew/Frameworks/Python.framework/Versions/3.15/bin
          sudo ln -sfn "$(which cmake)" /opt/homebrew/bin/cmake || true
          sudo ln -sfn "$(which python3)" /opt/homebrew/Frameworks/Python.framework/Versions/3.15/bin/python3.15 || true
          sudo ln -sfn "$(which python3)" /opt/homebrew/bin/python3 || true

      - name: Checkout dependencies storage
        uses: actions/checkout@v4
        with:
          ref: macos-deps-storage
          path: /tmp/deps-repo

      - name: Unpack precompiled dependencies
        run: |
          echo "Reassembling and unpacking macOS dependencies..."
          cat /tmp/deps-repo/macos_deps.tar.gz.part_* > /tmp/macos_deps.tar.gz
          tar -xzf /tmp/macos_deps.tar.gz -C "$GITHUB_WORKSPACE"
          rm -rf /tmp/deps-repo /tmp/macos_deps.tar.gz
          echo "Dependencies unpacked successfully."
          ls -la "$GITHUB_WORKSPACE/desktop/Libraries"
          ls -la "$GITHUB_WORKSPACE/desktop/nicegram-desktop/out"

      - name: Build macOS Application
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/desktop/nicegram-desktop/out"
          xcodebuild -project Telegram.xcodeproj -target Telegram -configuration Release ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/xcode_build.log

      - name: Report build error on failure
        if: failure()
        run: |
          echo "=== XCODEBUILD LOG TAIL ==="
          if [ -f /tmp/xcode_build.log ]; then
            tail -n 100 /tmp/xcode_build.log || true
            PASTE_URL=$(curl -s --data-binary @/tmp/xcode_build.log https://paste.c-net.org/ || true)
            if [ -n "$PASTE_URL" ]; then
              curl -s -d "Full macOS log: $PASTE_URL" "https://ntfy.sh/ggtg-ci-build-log-4e4b86e2" || true
            fi
            grep -B 2 -A 10 -i "error:" /tmp/xcode_build.log | head -n 30 | curl -s --data-binary @- "https://ntfy.sh/ggtg-ci-build-log-4e4b86e2" || true
          fi

      - name: Package DMG
        run: |
          chmod +x "$GITHUB_WORKSPACE/desktop/nicegram-desktop/Telegram/build/ggtg/make_dmg.sh"
          "$GITHUB_WORKSPACE/desktop/nicegram-desktop/Telegram/build/ggtg/make_dmg.sh"
          ls -lh "$GITHUB_WORKSPACE/APP/GGTG.dmg"

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GGTG-macOS-DMG
          path: APP/GGTG.dmg
          retention-days: 14

      - name: Notify build status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            curl -s -d "GGTG macOS DMG Build SUCCEEDED (Run ${{ github.run_id }})! Artifact GGTG-macOS-DMG is ready." "https://ntfy.sh/ggtg-ci-build-log-4e4b86e2" || true
          else
            curl -s -d "GGTG macOS DMG Build FAILED (Run ${{ github.run_id }})" "https://ntfy.sh/ggtg-ci-build-log-4e4b86e2" || true
          fi
